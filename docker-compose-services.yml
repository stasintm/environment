version: '3.8'

services:
      
  employee:
    image: employee:latest
    container_name: employee
    ports:
      - 8080:8080
    networks:
      - corpbot-network 
      
  bot:
    image: bot:latest
    container_name: bot
    environment:
      - BOT_NAME=StasintTestBot
      - BOT_TOKEN=token
    depends_on:
      - employee
    ports:
      - 8079:8079
    networks:
      - corpbot-network 

networks:
  corpbot-network:
    driver: bridge
